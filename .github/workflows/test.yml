name: Scheduler checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cc -DHOST_TEST -std=c11 -Wall -Wextra test.c scheduler.c -o scheduler_test && ./scheduler_test
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: arm-none-eabi-gcc -mcpu=cortex-m3 -mthumb -Wall -Wextra -c scheduler.c port.S
